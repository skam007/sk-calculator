<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(135deg, #111827, #312e81); padding: 20px; }
    .calculator { width: min(100%, 360px); padding: 20px; border-radius: 24px; background: #1f2937; box-shadow: 0 24px 60px #0008; }
    .display { width: 100%; height: 100px; margin-bottom: 16px; padding: 16px; border: 0; border-radius: 16px; background: #111827; color: #f9fafb; font: 600 2.4rem/1 system-ui, sans-serif; text-align: right; outline: none; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { min-height: 64px; border: 0; border-radius: 16px; cursor: pointer; background: #374151; color: #f9fafb; font-size: 1.25rem; font-weight: 600; transition: transform .1s, filter .1s; }
    button:hover { filter: brightness(1.2); } button:active { transform: scale(.95); }
    .operator { background: #4f46e5; } .utility { background: #6b7280; } .equals { background: #10b981; } .wide { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <input id="display" class="display" value="0" aria-label="Calculator display" readonly>
    <section class="keys">
      <button class="utility" data-action="clear">AC</button><button class="utility" data-action="delete">DEL</button><button class="operator" data-value="%">%</button><button class="operator" data-value="/">÷</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
      <button class="wide" data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="equals">=</button>
    </section>
  </main>
  <script>
    const display = document.querySelector('#display');
    let expression = '';
    let evaluated = false;
    function refresh() { display.value = expression || '0'; }
    function evaluateExpression(source) {
      let position = 0;
      function number() {
        let sign = 1;
        while (source[position] === '+' || source[position] === '-') {
          if (source[position++] === '-') sign *= -1;
        }
        const match = source.slice(position).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);
        if (!match) throw new Error('Expected a number');
        position += match[0].length;
        let value = sign * Number(match[0]);
        while (source[position] === '%') { value /= 100; position++; }
        return value;
      }
      function product() {
        let value = number();
        while (source[position] === '*' || source[position] === '/') {
          const operator = source[position++];
          const right = number();
          if (operator === '/' && right === 0) throw new Error('Division by zero');
          value = operator === '*' ? value * right : value / right;
        }
        return value;
      }
      let value = product();
      while (source[position] === '+' || source[position] === '-') {
        const operator = source[position++];
        const right = product();
        value = operator === '+' ? value + right : value - right;
      }
      if (position !== source.length || !Number.isFinite(value)) throw new Error('Invalid expression');
      return Number(value.toPrecision(12));
    }
    function calculate() {
      if (!expression) return;
      try { expression = String(evaluateExpression(expression)); evaluated = true; refresh(); }
      catch { display.value = 'Error'; expression = ''; evaluated = false; }
    }
    function input(value) {
      if (value === 'equals') { calculate(); return; }
      if (value === 'clear') expression = '';
      else if (value === 'delete') expression = expression.slice(0, -1);
      else {
        if (evaluated && /^[0-9.]$/.test(value)) expression = '';
        if (value === '.') {
          const currentNumber = expression.split(/[+*/%-]/).pop();
          if (currentNumber.includes('.')) return;
          if (!currentNumber) expression += '0';
        }
        expression += value;
      }
      evaluated = false;
      refresh();
    }
    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (button) input(button.dataset.action || button.dataset.value);
    });
    document.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      const key = event.key;
      if (/^[0-9.+*/%\-]$/.test(key)) input(key);
      else if (key === 'Enter' || key === '=') input('equals');
      else if (key === 'Backspace') input('delete');
      else if (key === 'Escape' || key.toLowerCase() === 'c') input('clear');
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
